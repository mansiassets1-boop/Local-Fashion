version: "3.9"

services:
  # ─── PostgreSQL ──────────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:15-3.4
    container_name: lf_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: localfashion
      POSTGRES_PASSWORD: localfashion
      POSTGRES_DB: localfashion
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localfashion"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: lf_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── API ──────────────────────────────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: lf_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://localfashion:localfashion@postgres:5432/localfashion
      REDIS_URL: redis://redis:6379
    ports:
      - "3001:3001"
    volumes:
      - ./apps/api:/app
      - /app/node_modules

  # ─── Buyer Web ────────────────────────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: lf_web
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - .env
    ports:
      - "3000:3000"

  # ─── Seller Dashboard ─────────────────────────────────────────────────────
  seller:
    build:
      context: ./apps/seller
      dockerfile: Dockerfile
    container_name: lf_seller
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - .env
    ports:
      - "3002:3002"

  # ─── Admin Panel ──────────────────────────────────────────────────────────
  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
    container_name: lf_admin
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - .env
    ports:
      - "3003:3003"

volumes:
  postgres_data:
  redis_data:
